version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: help-radius-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - SMS_PROVIDER=simulated
      - JWT_SECRET=help-radius-production-secret-key-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - help-radius-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_FIREBASE_PROJECT_ID=help-radius-prototype
    container_name: help-radius-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - help-radius-network

networks:
  help-radius-network:
    driver: bridge
